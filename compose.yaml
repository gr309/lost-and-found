name: lostfound-local
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lostfound}
      MYSQL_USER: ${DB_USERNAME:-lostfound}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-local.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lostfound}
      DB_USERNAME: ${DB_USERNAME:-lostfound}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh first}
      UPLOAD_DIR: /app/uploads
      PORT: 8080
      APP_ENV: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
volumes:
  mysql-data:
