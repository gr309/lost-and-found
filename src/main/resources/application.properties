spring.application.name=lostfound
spring.profiles.active=${APP_ENV:dev}

server.port=${PORT:8080}
server.address=0.0.0.0

debug=${APP_DEBUG:false}

logging.level.root=INFO
logging.level.com.learn.lostfound=${APP_LOG_LEVEL:INFO}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lostfound}?allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:lostfound}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SQL_DEBUG:false}
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local image storage. On Render use the persistent disk mount.
app.upload-dir=${UPLOAD_DIR:./uploads}

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
